<!DOCTYPE html>

<html>

  <head>

    <title>Profile card</title>

      <style>

       .profilecard
       {
        width:350px;
        height:450px;
        background:gray;
        position:relative;
        border-radius: 15px;
        border: 2px solid black;
       }

       .profileimg
       {
        height:150px;
        width:150px;
        position:absolute;
        top:20px;
        left:100px;
        z-index: 1;
        border-radius: 50%;
       }

       .profilecard h2
       {
        font-size: 22px;
        position:absolute;
        top:190px;
        left:0px;
        text-align: center;
        width: 100%;
       }

       .profilecard p
       {
        position:absolute;
        top:240px;
        left:0px;
        text-align: center;
        width: 100%;
       }

       .profilecard .profile
       {
        position:absolute;
        top:330px;
        left: 125px;
        background: black;
        color: white;
        padding: 10px 20px;
       }

       .profilecard .badge
       {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        background: red;
        color: white;
        padding: 5px 8px;
        border-radius: 50%;
       }

       .floating
       {
        position: fixed;
        right: 20px;
        bottom: 20px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: black;
        color: white;
       }

     </style>
  </head>

  <body>
    <h1>Profile Card</h1>
    
    <div class="profilecard">
      <img class="profileimg" src="profile.img" alt="image">
      <h2>Putta Pavan Kumar Reddy</h2>
      <p>Cyber Security Student</p>
      <button class="profile">View Profile</button>
      <span class="badge">3</span>
    </div>
    <button class="floating">+</button>
  </body>

</html>
